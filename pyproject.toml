[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uncloak"
dynamic = ["version"]
description = "Point it at a URL, get a working typed API client, and know when the site changes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer",
    "rich",
    "httpx",
    "pydantic>=2.0.0",
    "playwright",
    "genson",
    "jinja2"
]

[project.scripts]
uncloak = "uncloak.cli:app"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "respx",
    "pytest-httpserver"
]

[tool.hatch.version]
path = "src/uncloak/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uncloak"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]

[tool.mypy]
strict = true
disallow_untyped_defs = true
files = ["src/uncloak/"]
